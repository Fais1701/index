<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- INTRO SCREEN -->
<div id="intro">
  <h1 id="typingText"></h1>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" style="display:none;">

  <section class="hero">
    <h1>For Arishfa</h1>
    <p>Not everything you want… just everything you deserve</p>
    <button id="startBtn" onclick="scrollToForm()">Start</button>
  </section>

  <section class="wishlist">
    <h2>Your World</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section class="form-section" id="formSection">
    <h2>Add Something You Want</h2>

    <form action="https://formspree.io/f/xykbwayy" method="POST" class="form-box">
      <input type="hidden" name="_subject" value="New Wish Submission 💌">
      <input type="hidden" name="_redirect" value="false">

      <input type="text" name="wish" placeholder="What do you secretly want?" required>
      <textarea name="reason" placeholder="Why does this matter to you?" rows="4"></textarea>

      <button type="submit">Submit</button>
    </form>
  </section>

</div>

<!-- SUCCESS -->
<div id="successScreen" style="display:none;">
  <h1>Noted.</h1>
  <p>I’ll remember this.</p>
</div>

<script src="script.js"></script>
</body>
</html>
