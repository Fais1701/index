<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>Curated Just For You</h1>
  <p>A personal wishlist experience</p>
</header>

<section class="wishlist-container">
  <h2>Your Wishlist</h2>

  <div id="wishlist" class="wishlist-grid"></div>

  <div class="add-box">
    <input id="itemInput" placeholder="Add something you love..." />
    <button onclick="addItem()">Add</button>
  </div>
</section>

<footer>
  <p>Crafted with intent</p>
</footer>

<script src="script.js"></script>
</body>
</html>
