<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <h1>Curated For You</h1>
  <p>Not everything you want… just everything you deserve</p>
  <button onclick="scrollToForm()">Start</button>
</section>

<section class="wishlist">
  <h2>Your World</h2>
  <div class="cards">
    <div class="card">Late night drives 🌙</div>
    <div class="card">Your favorite perfume 💫</div>
    <div class="card">A surprise date ✨</div>
  </div>
</section>

<section class="form-section" id="formSection">
  <h2>Add Something You Want</h2>

  <form 
    action="https://formspree.io/f/xykbwayy"
    method="POST"
    onsubmit="handleSubmit(event)"
    class="form-box"
  >
    <input 
      type="text" 
      name="wish" 
      placeholder="What do you secretly want?" 
      required
    />

    <textarea 
      name="reason" 
      placeholder="Why does this matter to you?"
    ></textarea>

    <button type="submit">Submit</button>
  </form>
</section>

<div id="successScreen" class="hidden">
  <h1>Wish received ✨</h1>
  <p>I’ll remember this.</p>
</div>

<script src="script.js"></script>
</body>
</html>
